alerts:
  - name: high_p95_latency
    description: P95 latency /chat vượt ngưỡng SLO 3000ms trong thời gian dài.
    severity: critical
    condition: 'p95(latency_ms) on event response_sent > 3000'
    duration: 10m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-1

  - name: elevated_error_rate
    description: Tỉ lệ request lỗi tăng hoặc retrieval success rate tụt dưới 90%.
    severity: critical
    condition: 'error_rate_pct > 2 or retrieval_success_rate_pct < 90'
    duration: 5m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-2

  - name: cost_budget_burn
    description: Chi phí token tăng vọt, đốt error budget/ngân sách theo giờ.
    severity: warning
    condition: 'sum(cost_usd) on event response_sent > 2.5 USD per 1h'
    duration: 15m
    type: symptom-based
    channel: slack
    owner: oncall-llmops
    runbook: docs/alerts.md#alert-3
